name: Cross Repo Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate clients from reviewed repository snapshots
        run: pnpm contracts:codegen
      - name: Verify GitHub-release synchronization behavior
        run: pnpm test:integration-scripts
      - run: git diff --exit-code packages/api-clients/src/generated/contract-registry.ts packages/api-clients/contracts/generated-client.manifest.json
      - run: pnpm check
      - run: pnpm contracts:validate
      - run: pnpm design:validate
      - run: pnpm governance:validate
      - run: pnpm docs:validate
      - run: pnpm release:validate
      - run: pnpm integration:smoke
      - run: mkdir -p reports && pnpm compatibility:report > reports/compatibility-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-frontend-experience-compatibility-report
          path: |
            reports/compatibility-report.json
            reports/design-drift-report.json
            reports/governance-mode-report.json
