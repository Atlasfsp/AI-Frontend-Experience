version: v2
plugins:
  # Go protobuf generation
  - remote: buf.build/protocolbuffers/go
    out: ../../gen/go
    opt: paths=source_relative

  # Go gRPC generation
  - remote: buf.build/grpc/go
    out: ../../gen/go
    opt: paths=source_relative

  # gRPC-Gateway (REST proxy)
  - remote: buf.build/grpc-ecosystem/gateway
    out: ../../gen/go
    opt: paths=source_relative

  # OpenAPI v2 (Swagger) generation from proto
  - remote: buf.build/grpc-ecosystem/openapiv2
    out: ../../api/openapi
    opt:
      - logtostderr=true
      - allow_merge=true
      - merge_file_name=sdx-gateway-v1

  # TypeScript (for dashboard and review-ui)
  - remote: buf.build/connectrpc/es
    out: ../../gen/typescript
    opt: target=ts

  # Python (for sdx-learning-svc)
  - remote: buf.build/protocolbuffers/python
    out: ../../gen/python

  # Python gRPC
  - remote: buf.build/grpc/python
    out: ../../gen/python
