enum ArtifactType {
  ARTIFACT_TYPE_UNSPECIFIED = 0;
  ARTIFACT_TYPE_SOURCE_CODE = 1;
  ARTIFACT_TYPE_BINARY = 2;
  ARTIFACT_TYPE_CONTAINER_IMAGE = 3;
  ARTIFACT_TYPE_HELM_CHART = 4;
  ARTIFACT_TYPE_TERRAFORM_MODULE = 5;
  ARTIFACT_TYPE_SBOM = 6;
  ARTIFACT_TYPE_COMPLIANCE_PACKAGE = 7;
  ARTIFACT_TYPE_DOCS = 8;
  ARTIFACT_TYPE_TEST_REPORT = 9;
  ARTIFACT_TYPE_SECURITY_REPORT = 10;
  ARTIFACT_TYPE_PERF_REPORT = 11;
