enum AgentType {
  AGENT_TYPE_UNSPECIFIED = 0;
  AGENT_TYPE_ARCHITECT = 1;
  AGENT_TYPE_BUILDER = 2;
  AGENT_TYPE_VERIFIER = 3;
  AGENT_TYPE_SPEC = 4;
  AGENT_TYPE_DOMAIN = 5;
  AGENT_TYPE_TEST = 6;
  AGENT_TYPE_SECURITY = 7;
