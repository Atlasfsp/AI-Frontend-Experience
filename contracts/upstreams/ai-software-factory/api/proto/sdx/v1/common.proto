syntax = "proto3";

package sdx.v1;

option go_package = "github.com/stratogroup/neuroforge-sdx/gen/go/sdx/v1;sdxv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/any.proto";

// ─────────────────────────────────────────────
// Pagination
// ─────────────────────────────────────────────

message PaginationRequest {
  int32 page_size = 1;   // Max 100, default 20
  string page_token = 2; // Opaque cursor; empty for first page
}

message PaginationResponse {
  string next_page_token = 1; // Empty if last page
  int64 total_count = 2;
}

// ─────────────────────────────────────────────
// Error Model
// ─────────────────────────────────────────────

message SDXError {
  string code = 1;                  // Machine-readable: "SDX-4001"
  string message = 2;               // Human-readable description
  string details = 3;               // Technical details (debug only; omitted in prod)
  string request_id = 4;            // Correlation ID for support
  string doc_url = 5;               // Link to error documentation
  repeated FieldError fields = 6;   // Validation errors
}

message FieldError {
  string field = 1;
  string code = 2;
  string message = 3;
}

// ─────────────────────────────────────────────
// Enums — Shared across bounded contexts
// ─────────────────────────────────────────────

enum PlanTier {
  PLAN_TIER_UNSPECIFIED = 0;
  PLAN_TIER_STARTER = 1;
  PLAN_TIER_GROWTH = 2;
  PLAN_TIER_ENTERPRISE = 3;
  PLAN_TIER_SOVEREIGN = 4;
}

