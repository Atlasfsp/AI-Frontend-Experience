  NEXO_REGION_UNSPECIFIED = 0;
  NEXO_REGION_LAGOS = 1;
  NEXO_REGION_LONDON = 2;
  NEXO_REGION_ASHBURN = 3;
  NEXO_REGION_SINGAPORE = 4;
  NEXO_REGION_SAO_PAULO = 5;
}

