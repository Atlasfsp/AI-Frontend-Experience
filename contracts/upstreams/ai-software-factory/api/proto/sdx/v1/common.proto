// ─────────────────────────────────────────────
// Value Objects — Shared
// ─────────────────────────────────────────────

message ContentHash {
  string algorithm = 1; // Always "SHA-256"
  string hex_digest = 2; // 64 lowercase hex chars
}

message S3URI {
  string bucket = 1;
  string key = 2;
  NexoRegion region = 3;
}

message SignatureRef {
  string signer = 1; // "COSIGN"
  bytes signature = 2;
  string certificate = 3; // PEM
  string transparency_log_entry = 4; // Rekor URL
}

message ProvenanceRef {
  uint32 slsa_level = 1; // Always 3
  string builder_id = 2;
  string build_type = 3;
  repeated ProvenanceMaterial materials = 4;
  map<string, string> metadata = 5;
}

message ProvenanceMaterial {
  string uri = 1;
  ContentHash digest = 2;
}

message SBOMRef {
  string format = 1; // SPDX or CYCLONEDX
  string generator = 2; // SYFT
  S3URI storage_uri = 3;
  ContentHash content_hash = 4;
}

message TokenUsage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  ModelID model = 3;
  uint64 cost_microdollars = 4;
}

message GateResult {
  string gate_id = 1;     // G-01..G-14
  string metric_name = 2;
  double value = 3;
  double threshold = 4;
  string operator = 5;    // GTE, LTE, EQ
  bool passed = 6;
  google.protobuf.Timestamp evaluated_at = 7;
}

message DateRange {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

// ─────────────────────────────────────────────
// Tenant Context (propagated in gRPC metadata)
// ─────────────────────────────────────────────

// Not a proto message — carried as gRPC metadata headers:
//   x-tenant-id: ULID
//   x-workspace-id: ULID (optional)
//   x-nexo-region: LAGOS|LONDON|ASHBURN|SINGAPORE|SAO_PAULO
//   x-idempotency-key: UUIDv4 (optional, for mutating requests)
