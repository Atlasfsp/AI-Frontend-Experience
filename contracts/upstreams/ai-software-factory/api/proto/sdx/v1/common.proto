  COMPLIANCE_FRAMEWORK_SOC2_TYPE_II = 1;
  COMPLIANCE_FRAMEWORK_HIPAA = 2;
  COMPLIANCE_FRAMEWORK_GDPR = 3;
  COMPLIANCE_FRAMEWORK_ISO_27001 = 4;
  COMPLIANCE_FRAMEWORK_PCI_DSS_V4 = 5;
  COMPLIANCE_FRAMEWORK_NIST_800_53 = 6;
  COMPLIANCE_FRAMEWORK_OWASP_TOP_10 = 7;
