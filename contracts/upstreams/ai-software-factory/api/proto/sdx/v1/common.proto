  LANGUAGE_CODE_SWIFT = 6;
  LANGUAGE_CODE_KOTLIN = 7;
  LANGUAGE_CODE_JAVA = 8;
  LANGUAGE_CODE_C = 9;
  LANGUAGE_CODE_CPP = 10;
  LANGUAGE_CODE_SQL = 11;
  LANGUAGE_CODE_HCL = 12;
}

enum ComplianceFramework {
