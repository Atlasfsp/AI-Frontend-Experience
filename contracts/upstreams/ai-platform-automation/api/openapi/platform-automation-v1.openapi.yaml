openapi: 3.1.0
info:
  title: BAC Platform Automation Control Plane API
  version: 1.0.0
  description: Versioned control plane contract for regions, clusters, workspaces, promises, incidents, policy posture, and quota views.
servers:
  - url: https://platform.ng.bac.stratogroup.dev
paths:
  /v1/control-plane/summary:
    get:
      operationId: getControlPlaneSummary
      summary: Get the global control-plane dashboard summary
      responses:
        "200":
          description: Control plane summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlPlaneSummary"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/regions:
    get:
      operationId: listRegions
      summary: List managed regions
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Region list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionListResponse"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/clusters:
    get:
      operationId: listClusters
      summary: List managed clusters
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Region"
      responses:
        "200":
          description: Cluster list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterListResponse"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List provisioned workspaces
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Workspace list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListResponse"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/promises:
    get:
      operationId: listPromises
      summary: List platform promises
      responses:
        "200":
          description: Promise list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromiseListResponse"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/incidents:
    get:
      operationId: listIncidents
      summary: List active incidents
      responses:
        "200":
          description: Incident list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentListResponse"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/policy/summary:
    get:
      operationId: getPolicySummary
      summary: Get compliance and policy summary
      responses:
        "200":
          description: Policy summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicySummary"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/quotas/summary:
    get:
      operationId: getQuotaSummary
      summary: Get quota and cost summary
      responses:
        "200":
          description: Quota summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaSummary"
        default:
          $ref: "#/components/responses/ApiError"
components:
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Region:
      name: region
      in: query
      schema:
        type: string
    TenantId:
      name: tenantId
      in: query
      schema:
        type: string
  responses:
    ApiError:
      description: Normalized API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      required: [code, message, status, category, requestId, retryable, details]
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
        category:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
        details:
          type: array
          items:
            type: string
    ControlPlaneSummary:
      type: object
      required: [regions, clusters, workspaces, activeIncidents, policyPosture]
      properties:
        regions:
          type: integer
        clusters:
          type: integer
        workspaces:
          type: integer
        activeIncidents:
          type: integer
        policyPosture:
          type: string
    PageInfo:
      type: object
      required: [nextCursor, pageSize]
      properties:
        nextCursor:
          type: string
        pageSize:
          type: integer
    RegionSummary:
      type: object
      required: [regionId, name, status, clusterCount, workspaceCount]
      properties:
        regionId:
          type: string
        name:
          type: string
        status:
          type: string
        clusterCount:
          type: integer
        workspaceCount:
          type: integer
    ClusterSummary:
      type: object
      required: [clusterId, regionId, status, nodeCount, workspaceCount]
      properties:
        clusterId:
          type: string
        regionId:
          type: string
        status:
          type: string
        nodeCount:
          type: integer
        workspaceCount:
          type: integer
    WorkspaceSummary:
      type: object
      required: [workspaceId, tenantId, regionId, status, promiseCount]
      properties:
        workspaceId:
          type: string
        tenantId:
          type: string
        regionId:
          type: string
        status:
          type: string
        promiseCount:
          type: integer
    PromiseSummary:
      type: object
      required: [promiseId, name, category, version, status]
      properties:
        promiseId:
          type: string
        name:
          type: string
        category:
          type: string
        version:
          type: string
        status:
          type: string
    IncidentSummary:
      type: object
      required: [incidentId, severity, status, summary, workspaceId]
      properties:
        incidentId:
          type: string
        severity:
          type: string
        status:
          type: string
        summary:
          type: string
        workspaceId:
          type: string
    PolicySummary:
      type: object
      required: [posture, openFindings, driftScore]
      properties:
        posture:
          type: string
        openFindings:
          type: integer
        driftScore:
          type: string
    QuotaSummary:
      type: object
      required: [budgetBurn, quotaHeadroom, workspaceCount]
      properties:
        budgetBurn:
          type: string
        quotaHeadroom:
          type: string
        workspaceCount:
          type: integer
    RegionListResponse:
      type: object
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RegionSummary"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    ClusterListResponse:
      type: object
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClusterSummary"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    WorkspaceListResponse:
      type: object
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceSummary"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    PromiseListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PromiseSummary"
    IncidentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IncidentSummary"
