version: '3.8'
services:
  software-factory-web:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP_NAME: software-factory-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BAC_ENV=staging
      - NEXT_PUBLIC_BAC_ENABLE_MOCK_API=false
      - NEXT_PUBLIC_BAC_API_URL=${BAC_API_URL:-http://api:8080}
      - NEXT_PUBLIC_BAC_REGION=${BAC_REGION:-ng}
      - NEXT_PUBLIC_SENTRY_DSN=${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  platform-automation-web:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP_NAME: platform-automation-web
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BAC_ENV=staging
      - NEXT_PUBLIC_BAC_ENABLE_MOCK_API=false
      - NEXT_PUBLIC_BAC_API_URL=${BAC_API_URL:-http://api:8080}
      - NEXT_PUBLIC_BAC_REGION=${BAC_REGION:-ng}
      - NEXT_PUBLIC_SENTRY_DSN=${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  docs-portal:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP_NAME: docs-portal
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BAC_ENV=staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
